server:
  port: 8080

spring:
  application:
    name: weekly-report-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weekly_report}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Mayu@1999
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema is fully owned by Flyway migrations. Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # Overridden via env var in real deployments. Must be at least 256 bits for HS256.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-in-every-environment-1234567890}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  submission:
    # Day of week (1=Mon..7=Sun) and time by which a report is considered "late" if not Submitted/Approved
    deadline-day-of-week: ${SUBMISSION_DEADLINE_DOW:5}
    deadline-hour: ${SUBMISSION_DEADLINE_HOUR:18}
  seed:
    # When true, populates demo users/projects/reports on startup if the DB is empty.
    # Never enabled by default - turn on explicitly for local/dev evaluation only.
    enabled: ${SEED_DEMO_DATA:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.teamreports.weeklyreport: INFO
    org.springframework.security: WARN
