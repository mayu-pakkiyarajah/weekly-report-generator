server:
  port: 8080

spring:
  application:
    name: weekly-report-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weekly_report}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Mayu@1999
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-in-every-environment-1234567890}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  submission:
    deadline-day-of-week: ${SUBMISSION_DEADLINE_DOW:5}
    deadline-hour: ${SUBMISSION_DEADLINE_HOUR:18}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  ai:
    # Optional AI chat assistant (assignment section 8, "good to have"). Disabled unless
    # an API key is supplied - the app runs perfectly well with this entirely off.
    enabled: ${AI_ASSISTANT_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-5}
    api-base-url: ${AI_API_BASE_URL:https://api.anthropic.com}
    max-tool-iterations: ${AI_MAX_TOOL_ITERATIONS:4}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.teamreports.weeklyreport: INFO
    org.springframework.security: WARN
