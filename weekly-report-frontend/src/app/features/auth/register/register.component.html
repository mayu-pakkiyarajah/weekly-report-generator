<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-brand">
      <span class="brand-mark">WR</span>
      <h1>Weekly Reports</h1>
    </div>
    <p class="subtitle">Create your team member account. Managers are added separately by an admin.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" class="input" type="text" formControlName="fullName" autocomplete="name" />
        <span class="error" *ngIf="form.controls.fullName.touched && form.controls.fullName.invalid">
          Enter your full name.
        </span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
        <span class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address.
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" formControlName="password" autocomplete="new-password" />
        <span class="hint">At least 8 characters.</span>
        <span class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password must be at least 8 characters.
        </span>
      </div>

      <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
