<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-brand">
      <span class="brand-mark">WR</span>
      <h1>Weekly Reports</h1>
    </div>
    <p class="subtitle">Sign in to submit or review weekly reports.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
        <span class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address.
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" formControlName="password" autocomplete="current-password" />
        <span class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required.
        </span>
      </div>

      <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
